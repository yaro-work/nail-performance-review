<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" role="img" aria-labelledby="title description"><title id="title">nail-performance-review: from goals to measured project evidence</title><desc id="description">Illustrative six-step workflow. Set a Google Cloud to AWS migration goal and a Senior-to-Staff growth goal, start an infrastructure project, record an implementation milestone, consider whether the project is nearly ready, record p95 latency changing from 100 to 50 milliseconds, and consider growth suggestions informed by the career ladder from step one. Your AI chat judges progress from the conversation; the plugin does not independently monitor project completion or dashboards.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#284955" fill-opacity=".5"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#51dfbc" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#091b25"/><rect x="1" y="1" width="1238" height="998" rx="18" fill="url(#dots)" stroke="#284955"/><g font-family="Segoe UI,Arial,sans-serif"><text x="44" y="48" font-size="13" fill="#51dfbc" letter-spacing="2">NAIL-PERFORMANCE-REVIEW / WORKFLOW</text><text x="44" y="105" font-size="43" fill="#edf8f6" font-weight="700">Your goals. Your work. Your evidence.</text><text x="44" y="141" font-size="20" fill="#a9c3ca" >One infrastructure project, from Senior toward Staff.</text><path d="M408 330 H428" fill="none" stroke="#51dfbc" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/><path d="M802 330 H822" fill="none" stroke="#51dfbc" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/><path d="M1014 480 V518 H226 V550" fill="none" stroke="#51dfbc" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/><path d="M408 710 H428" fill="none" stroke="#51dfbc" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/><path d="M802 710 H822" fill="none" stroke="#51dfbc" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/><g stroke-dasharray="5 5"><path d="M1196 820 H1218 V161 H226 V172" fill="none" stroke="#51dfbc" stroke-opacity=".65" stroke-width="2" marker-end="url(#arrow)"/></g><g class="card" data-step="1" transform="translate(44,180)"><rect width="364" height="300" rx="16" fill="#102934" stroke="#284955"/><rect x="0" y="25" width="3" height="35" rx="1" fill="#51dfbc"/><text x="24" y="35" font-size="12" fill="#51dfbc" letter-spacing="1.3" font-family="ui-monospace,Consolas,monospace">DAY 0 / SETUP</text><text x="24" y="73" font-size="24" fill="#edf8f6" font-weight="650">Set your direction</text><rect x="24" y="92" width="316" height="30" rx="7" fill="#51dfbc" fill-opacity=".09" stroke="#51dfbc" stroke-opacity=".35"/><text x="36" y="113" font-size="15" fill="#51dfbc" >nail-performance-review-setup</text><text x="24" y="152" font-size="18" fill="#a9c3ca" >Paste company + growth goals.</text><text x="24" y="177" font-size="18" fill="#a9c3ca" >Company: Google Cloud → AWS.</text><text x="24" y="202" font-size="18" fill="#a9c3ca" >Growth: Senior → Staff.</text><rect x="24" y="245" width="296" height="30" rx="7" fill="#51dfbc" fill-opacity=".09" stroke="#51dfbc" stroke-opacity=".35"/><text x="36" y="266" font-size="15" fill="#51dfbc" >Add your company’s career ladder</text></g><g class="card" data-step="2" transform="translate(438,180)"><rect width="364" height="300" rx="16" fill="#102934" stroke="#284955"/><rect x="0" y="25" width="3" height="35" rx="1" fill="#91c9ee"/><text x="24" y="35" font-size="12" fill="#91c9ee" letter-spacing="1.3" font-family="ui-monospace,Consolas,monospace">DAY 37 / PROJECT ABCD</text><text x="24" y="73" font-size="24" fill="#edf8f6" font-weight="650">Start the project</text><rect x="24" y="96" width="316" height="62" rx="8" fill="#091b25"/><text x="36" y="121" font-size="18" fill="#edf8f6" >Redesigning infrastructure</text><text x="36" y="146" font-size="18" fill="#edf8f6" >for application ABCD</text><text x="24" y="190" font-size="18" fill="#a9c3ca" >Your AI chat receives your goals.</text><text x="24" y="215" font-size="18" fill="#a9c3ca" >It checks the project’s fit.</text><text x="24" y="250" font-size="15" fill="#a9c3ca" >A plan alone is not saved as an achievement.</text><text x="24" y="276" font-size="16" fill="#a9c3ca" >You need to reach a real milestone.</text></g><g class="card" data-step="3" transform="translate(832,180)"><rect width="364" height="300" rx="16" fill="#102934" stroke="#284955"/><rect x="0" y="25" width="3" height="35" rx="1" fill="#51dfbc"/><text x="24" y="35" font-size="12" fill="#51dfbc" letter-spacing="1.3" font-family="ui-monospace,Consolas,monospace">AFTER A REAL MILESTONE</text><text x="24" y="73" font-size="22" fill="#edf8f6" font-weight="650">Once you start implementing</text><text x="24" y="115" font-size="18" fill="#a9c3ca" >You implement the staged rollout</text><text x="24" y="140" font-size="18" fill="#a9c3ca" >with Avery.</text><text x="24" y="190" font-size="18" fill="#51dfbc" >The plugin’s tracking skill notices</text><text x="24" y="215" font-size="18" fill="#51dfbc" >the milestone and adds it to your</text><text x="24" y="240" font-size="18" fill="#51dfbc" >in-progress achievements.</text><text x="24" y="277" font-size="16" fill="#a9c3ca" >Your contribution + shared credit</text></g><g class="card" data-step="4" transform="translate(44,560)"><rect width="364" height="300" rx="16" fill="#102934" stroke="#284955"/><rect x="0" y="25" width="3" height="35" rx="1" fill="#ffc47b"/><text x="24" y="73" font-size="24" fill="#edf8f6" font-weight="650">Collect the outcome</text><text x="24" y="110" font-size="16" fill="#ffc47b" >Your AI chat quietly checks:</text><text x="24" y="142" font-size="20" fill="#edf8f6" >“Is the project almost ready?”</text><rect x="24" y="167" width="139" height="30" rx="7" fill="#a9c3ca" fill-opacity=".09" stroke="#a9c3ca" stroke-opacity=".35"/><text x="36" y="188" font-size="15" fill="#a9c3ca" >Not ready? Quiet.</text><rect x="174" y="167" width="166" height="30" rx="7" fill="#ffc47b" fill-opacity=".09" stroke="#ffc47b" stroke-opacity=".35"/><text x="186" y="188" font-size="15" fill="#ffc47b" >Ready? Ask below.</text><text x="24" y="228" font-size="18" fill="#edf8f6" >“Which KPIs or outcomes</text><text x="24" y="253" font-size="18" fill="#edf8f6" >can we, or should we, measure?”</text><text x="24" y="285" font-size="16" fill="#a9c3ca" >Fires only when a reminder is eligible.</text></g><g class="card" data-step="5" transform="translate(438,560)"><rect width="364" height="300" rx="16" fill="#102934" stroke="#284955"/><rect x="0" y="25" width="3" height="35" rx="1" fill="#51dfbc"/><text x="24" y="35" font-size="12" fill="#51dfbc" letter-spacing="1.3" font-family="ui-monospace,Consolas,monospace">NEXT CHECK-IN / OUTCOMES</text><text x="24" y="73" font-size="24" fill="#edf8f6" font-weight="650">Keep the measured impact</text><text x="24" y="128" font-size="43" fill="#51dfbc" font-weight="700">100 → 50 ms</text><rect x="24" y="150" width="296" height="30" rx="7" fill="#51dfbc" fill-opacity=".09" stroke="#51dfbc" stroke-opacity=".35"/><text x="36" y="171" font-size="15" fill="#51dfbc" >Fictional: 50% lower p95 latency</text><text x="24" y="211" font-size="18" fill="#a9c3ca" >Once you and your AI establish</text><text x="24" y="236" font-size="18" fill="#a9c3ca" >what improved measurably, it</text><text x="24" y="261" font-size="18" fill="#a9c3ca" >saves it with supporting links.</text></g><g class="card" data-step="6" transform="translate(832,560)"><rect width="364" height="300" rx="16" fill="#102934" stroke="#284955"/><rect x="0" y="25" width="3" height="35" rx="1" fill="#91c9ee"/><text x="24" y="73" font-size="24" fill="#edf8f6" font-weight="650">Help with your growth</text><text x="24" y="111" font-size="18" fill="#a9c3ca" >The plugin checks your project</text><text x="24" y="136" font-size="18" fill="#a9c3ca" >against your Senior → Staff goal.</text><text x="24" y="181" font-size="18" fill="#edf8f6" >It might suggest a broader demo</text><text x="24" y="206" font-size="18" fill="#edf8f6" >or applying the learning to</text><text x="24" y="231" font-size="18" fill="#edf8f6" >other projects.</text><text x="24" y="267" font-size="16" fill="#91c9ee" >Suggestions follow the career ladder</text><text x="24" y="289" font-size="16" fill="#91c9ee" >you added in step 1. ↗</text></g><text x="44" y="918" font-size="20" fill="#edf8f6" >The readiness hook question is planned. Current hooks load context at startup.</text><text x="44" y="951" font-size="17" fill="#a9c3ca" >Prompts: one per session, two per rolling seven days. Fictional project and example measurements.</text></g></svg>
